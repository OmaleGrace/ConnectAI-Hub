{{template "head" .}}{{template "nav" .}}<main class="auth-wrap"><section class="auth-card"><a class="back-link" href="/login">← Back to login</a><div class="eyebrow">VERIFIED PASSWORD RESET</div><h1>Choose a new <span class="gradient-text">password.</span></h1>{{if .Error}}<div class="form-error">{{.Error}}</div>{{end}}<form method="post" action="/reset-password" class="auth-form"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><input type="hidden" name="token" value="{{.Name}}"><label>New password<div class="password-field"><input type="password" name="password" required minlength="8" data-password-field><button class="toggle-password" type="button">Show</button></div><small class="live-feedback password-rules" data-password-feedback>Use 8+ characters with a letter, number and symbol.</small></label><label>Confirm new password<div class="password-field"><input type="password" name="confirm_password" required minlength="8" data-password-field><button class="toggle-password" type="button">Show</button></div></label><button class="button auth-submit" type="submit">Reset password <span>→</span></button></form></section></main>{{template "footer" .}}
