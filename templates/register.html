{{template "head" .}}{{template "nav" .}}<main class="auth-wrap"><section class="auth-card"><a class="back-link" href="/">← Back home</a><div class="eyebrow">START YOUR JOURNEY</div><h1>Create your <span class="gradient-text">account.</span></h1><p class="auth-intro">One account gives you access to all seven AI workspaces.</p>{{if .Error}}<div class="form-error">{{.Error}}</div>{{end}}<form method="post" action="/register" class="auth-form"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label>Your name<input type="text" name="name" autocomplete="name" required minlength="2" maxlength="80" placeholder="Your full name"></label><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label><label>Password <small>(at least 10 characters)</small><input type="password" name="password" autocomplete="new-password" required minlength="10"></label><button class="button auth-submit" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="/login">Log in</a></p></section></main>{{template "footer" .}}
