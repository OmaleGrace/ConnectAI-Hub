{{template "head" .}}{{template "nav" .}}<main class="auth-wrap"><section class="auth-card"><a class="back-link" href="/">← Back home</a><div class="eyebrow">START YOUR JOURNEY</div><h1>Create your <span class="gradient-text">account.</span></h1><p class="auth-intro">One account gives you access to all seven AI workspaces.</p>{{if .Error}}<div class="form-error">{{.Error}}</div>{{end}}<form method="post" action="/register" class="auth-form" data-live-form><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label>Your name <small>(at least 3 characters)</small><input type="text" name="name" autocomplete="name" required minlength="3" maxlength="80" placeholder="Your full name" data-name-check><small class="live-feedback" data-name-feedback></small></label><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com" data-email-check><small class="live-feedback" data-email-feedback></small></label><label>Password <small>(8+ characters, letter, number and symbol)</small><div class="password-field"><input type="password" name="password" autocomplete="new-password" required minlength="8" data-password-field><button class="toggle-password" type="button" aria-label="Show password">Show</button></div><small class="live-feedback password-rules" data-password-feedback>Use 8+ characters with a letter, number and symbol.</small></label><button class="button auth-submit" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="/login">Log in</a></p></section></main>{{template "footer" .}}
