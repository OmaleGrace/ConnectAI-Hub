{{template "head" .}}{{template "nav" .}}<main class="auth-wrap"><section class="auth-card"><a class="back-link" href="/">← Back home</a><div class="eyebrow">START YOUR JOURNEY</div><h1>Create your <span class="gradient-text">account.</span></h1><p class="auth-intro">One account gives you access to all seven AI workspaces.</p>{{if .Error}}<div class="form-error">{{.Error}}</div>{{end}}<form method="post" action="/register" class="auth-form" data-live-form><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label>Full name <small>(at least 3 characters)</small><input type="text" name="name" autocomplete="name" required minlength="3" maxlength="80" placeholder="Your full name" data-name-check><small class="live-feedback" data-name-feedback></small></label><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com" data-email-check><small class="live-feedback" data-email-feedback></small></label><label>Phone number <small>(optional)</small><input type="tel" name="phone" autocomplete="tel" maxlength="32" placeholder="e.g. +234..." inputmode="tel"></label><label>What will you mainly use ConnectAI Hub for?<select name="purpose" required><option value="">Choose one</option><option value="personal">Personal use</option><option value="student">Student / learning</option><option value="developer">Software development</option><option value="business">Business</option><option value="professional">Professional work</option><option value="other">Other</option></select></label><label>School, company or organisation <small>(optional)</small><input type="text" name="organization" maxlength="100" placeholder="Name of your school or organisation"></label><label>Password <small>(8+ characters, letter, number and symbol)</small><div class="password-field"><input type="password" name="password" autocomplete="new-password" required minlength="8" data-password-field><button class="toggle-password" type="button" aria-label="Show password">Show</button></div><small class="live-feedback password-rules" data-password-feedback>Use 8+ characters with a letter, number and symbol.</small></label><label class="terms-check"><input type="checkbox" name="terms" value="accepted" required> <span>I agree to use ConnectAI Hub responsibly and not upload information I do not have permission to share.</span></label><button class="button auth-submit" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="/login">Log in</a></p></section></main>{{template "footer" .}}
